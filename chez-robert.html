<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Menu</title><style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0a; padding: 20px; min-height: 100vh; color: #fafafa; }
    .container { max-width: 900px; margin: 0 auto; background: #1a1a1a; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
    h1 { text-align: center; color: #10b981; margin-bottom: 32px; font-size: 2.5rem; font-weight: 800; }
    .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 32px; border-bottom: 3px solid rgba(255,255,255,0.1); padding-bottom: 16px; }
    .tab { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; color: #a3a3a3; background: rgba(255,255,255,0.05); transition: all 0.3s; font-size: 0.9rem; }
    .tab.active { background: #10b981; color: #0a0a0a; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .tab:hover:not(.active) { background: rgba(16,185,129,0.15); color: #10b981; }
    .lang-section { display: none; }
    .lang-section.active { display: block; }
    .section { margin-bottom: 32px; background: rgba(255,255,255,0.03); padding: 24px; border-radius: 12px; border-left: 5px solid #10b981; }
    .section-title { color: #10b981; font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .menu-item { padding: 16px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
    .menu-item:last-child { border-bottom: none; }
    .item-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 15px; width: 100%%; }
    .dish-title { font-weight: 800; color: #fafafa; font-size: 1.15rem; flex: 1; line-height: 1.3; }
    .dish-desc { font-style: italic; font-weight: 400; color: #a3a3a3; font-size: 0.95rem; display: block; margin-top: 6px; line-height: 1.5; }
    .item-price { font-weight: 800; color: #34d399; font-size: 1.1rem; white-space: nowrap; min-width: 60px; text-align: right; }
    .footer { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 3px solid rgba(255,255,255,0.1); color: #6b7280; font-size: 0.9rem; font-weight: 600; }
    </style></head><body><div class="container"><div class="tabs"><div class="tab active" data-lang="fr">FR</div><div class="tab" data-lang="en">EN</div><div class="tab" data-lang="es">ES</div><div class="tab" data-lang="de">DE</div><div class="tab" data-lang="it">IT</div><div class="tab" data-lang="ru">RU</div></div><div class="lang-section active" id="lang-fr"><h1>🍽️ Le Menu</h1><div class="section"><h2 class="section-title">Desserts</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">tarte aux poils</div><div class="item-price">20 €</div></div></div></div></div></div><div class="lang-section" id="lang-en"><h1>🍽️ The Menu</h1><div class="section"><h2 class="section-title">Desserts</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">hair pie</div><div class="item-price">20 €</div></div></div></div></div></div><div class="lang-section" id="lang-es"><h1>🍽️ El Menú</h1><div class="section"><h2 class="section-title">Postres</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">pastel de pelo</div><div class="item-price">20 €</div></div></div></div></div></div><div class="lang-section" id="lang-de"><h1>🍽️ Die Speisekarte</h1><div class="section"><h2 class="section-title">Desserts</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">Haarkuchen</div><div class="item-price">20 €</div></div></div></div></div></div><div class="lang-section" id="lang-it"><h1>🍽️ Il Menu</h1><div class="section"><h2 class="section-title">Dolci</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">torta per capelli</div><div class="item-price">20 €</div></div></div></div></div></div><div class="lang-section" id="lang-ru"><h1>🍽️ Меню</h1><div class="section"><h2 class="section-title">Десерты</h2><div class="items"><div class="menu-item"><div class="item-top-row"><div class="dish-title">пирог для волос</div><div class="item-price">20 €</div></div></div></div></div></div><div class="footer">ArdoiseDigitale</div></div><script>
    document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            var lang = this.getAttribute('data-lang');
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.lang-section').forEach(function(s) { s.classList.remove('active'); });
            this.classList.add('active');
            document.getElementById('lang-' + lang).classList.add('active');
        });
    });
    </script></body></html>
