<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArdoiseDigitale - Saisie Menu</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0a0a0a; padding: 20px; min-height: 100vh; color: #fafafa; }
.container { max-width: 900px; margin: 0 auto; background: #1a1a1a; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
h1 { text-align: center; color: #10b981; margin-bottom: 32px; font-size: 2.5rem; font-weight: 800; }
.section { margin-bottom: 32px; background: rgba(255,255,255,0.03); padding: 24px; border-radius: 12px; border-left: 5px solid #10b981; }
.section-title { color: #10b981; font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
.menu-item { margin-bottom: 16px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); display: flex; gap: 12px; align-items: flex-start; }
.item-nom { flex: 1; min-height: 60px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fafafa; font-size: 1rem; font-family: inherit; resize: vertical; }
.item-nom:focus { outline: none; border-color: #10b981; background: rgba(255,255,255,0.08); }
.item-prix { width: 100px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fafafa; font-size: 1rem; font-family: inherit; }
.item-prix:focus { outline: none; border-color: #10b981; background: rgba(255,255,255,0.08); }
.item-prix:-webkit-autofill, .item-prix:-webkit-autofill:hover, .item-prix:-webkit-autofill:focus, .item-nom:-webkit-autofill, .item-nom:-webkit-autofill:hover, .item-nom:-webkit-autofill:focus { -webkit-text-fill-color: #fafafa; -webkit-box-shadow: 0 0 0px 1000px rgba(255,255,255,0.05) inset; transition: background-color 5000s ease-in-out 0s; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
.btn-add { background: #10b981; color: #0a0a0a; }
.btn-add:hover { background: #34d399; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
.btn-remove { background: #ef4444; color: #fafafa; padding: 8px 14px; font-size: 1.2rem; line-height: 1; }
.btn-remove:hover { background: #dc2626; }
.btn-submit { background: #10b981; color: #0a0a0a; padding: 16px 32px; font-size: 1.1rem; margin-top: 24px; display: block; margin-left: auto; margin-right: auto; }
.btn-submit:hover { background: #34d399; box-shadow: 0 6px 20px rgba(16,185,129,0.5); transform: translateY(-2px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.footer { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 3px solid rgba(255,255,255,0.1); color: #6b7280; font-size: 0.9rem; font-weight: 600; }
#result-zone { display: none; text-align: center; padding: 40px 20px; background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(10px); border-radius: 20px; margin-top: 40px; }
#result-zone h2 { color: #10b981; font-size: 2rem; margin-bottom: 24px; font-weight: 800; }
#qr-display img { width: 10cm; height: 10cm; background: #fafafa; padding: 0; margin: 20px auto; display: block; }
#result-zone .buttons { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
#result-zone .btn-link { display: inline-block; background: #10b981; color: #0a0a0a; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 1rem; transition: all 0.3s; }
#result-zone .btn-link:hover { background: #34d399; box-shadow: 0 6px 20px rgba(16,185,129,0.5); transform: translateY(-2px); }
#result-zone .btn-print { background: rgba(255,255,255,0.1); color: #fafafa; padding: 14px 28px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
#result-zone .btn-print:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
#result-zone .btn-close { background: #ef4444; color: #fafafa; padding: 14px 28px; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
#result-zone .btn-close:hover { background: #dc2626; }
@media print {
  body * { visibility: hidden; }
  #qr-display, #qr-display * { visibility: visible; }
  #qr-display { position: absolute; left: 0; top: 0; width: 10cm; height: 10cm; }
  #qr-display img { width: 10cm; height: 10cm; }
}
</style>
</head>
<body>
<div class="container">
<h1>🍽️ ArdoiseDigitale</h1>
<form method="POST" action="/" id="menuForm">
<div class="section">
<div class="section-title">🥗 Entrées</div>
<div id="entrees-container"></div>
<button type="button" class="btn btn-add" onclick="addItem('entrees')">+ Ajouter une entrée</button>
</div>
<div class="section">
<div class="section-title">🍖 Plats</div>
<div id="plats-container"></div>
<button type="button" class="btn btn-add" onclick="addItem('plats')">+ Ajouter un plat</button>
</div>
<div class="section">
<div class="section-title">🍰 Desserts</div>
<div id="desserts-container"></div>
<button type="button" class="btn btn-add" onclick="addItem('desserts')">+ Ajouter un dessert</button>
</div>
<div class="section">
<div class="section-title">🍽️ Formules</div>
<div id="formules-container"></div>
<button type="button" class="btn btn-add" onclick="addItem('formules')">+ Ajouter une formule</button>
</div>
<button type="submit" class="btn btn-submit">🚀 Générer le menu et le Qrcode</button>
</form>
<div id="result-zone">
<h2>✅ Menu Généré avec Succès !</h2>
<div id="qr-display"></div>
<div class="buttons">
<a id="github-link" href="#" target="_blank" class="btn-link">🌐 Voir le menu en ligne</a>
<button onclick="window.print()" class="btn-print">🖨️ Imprimer le QR Code</button>
<button type="button" onclick="closeResult()" class="btn-close">✖ Fermer</button>
</div>
</div>
<div class="footer">ArdoiseDigitale by updatedmam - Traduction automatique multilingue</div>
</div>
<script>
const STORAGE_KEY = 'ardoise_menu_data';

function addItem(category, nom = '', prix = '') {
    const container = document.getElementById(category + '-container');
    const itemDiv = document.createElement('div');
    itemDiv.className = 'menu-item';
    itemDiv.innerHTML = '<textarea class="item-nom" name="' + category + '_nom[]" placeholder="Nom du plat" oninput="saveData()">' + nom + '</textarea><input type="text" class="item-prix" name="' + category + '_prix[]" placeholder="Prix" value="' + prix + '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();}" oninput="saveData()"><button type="button" class="btn btn-remove" onclick="this.parentElement.remove(); saveData();"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>';
    container.appendChild(itemDiv);
}

function saveData() {
    const menu = { entrees: [], plats: [], desserts: [], formules: [] };
    let globalId = 0;
    ['entrees', 'plats', 'desserts', 'formules'].forEach(function(cat) {
        const items = document.querySelectorAll('#' + cat + '-container .menu-item');
        items.forEach(function(item) {
            const nom = item.querySelector('.item-nom').value;
            const prix = item.querySelector('.item-prix').value;
            menu[cat].push({ id: 'item_' + globalId, nom: nom, prix: prix });
            globalId++;
        });
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(menu));
}

function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            const menu = JSON.parse(saved);
            let hasData = false;
            ['entrees', 'plats', 'desserts', 'formules'].forEach(function(cat) {
                if (menu[cat] && menu[cat].length > 0) {
                    document.getElementById(cat + '-container').innerHTML = '';
                    menu[cat].forEach(function(item) {
                        if (item.nom || item.prix) {
                            addItem(cat, item.nom, item.prix);
                            hasData = true;
                        }
                    });
                }
            });
            if (!hasData) {
                addItem('entrees'); addItem('plats'); addItem('desserts'); addItem('formules');
            }
        } catch(e) {
            addItem('entrees'); addItem('plats'); addItem('desserts'); addItem('formules');
        }
    } else {
        addItem('entrees'); addItem('plats'); addItem('desserts'); addItem('formules');
    }
}

function closeResult() {
    document.getElementById('result-zone').style.display = 'none';
    document.getElementById('menuForm').style.display = 'block';
}

loadData();

document.getElementById('menuForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const menu = { entrees: [], plats: [], desserts: [], formules: [] };
    ['entrees', 'plats', 'desserts', 'formules'].forEach(function(cat) {
        const items = document.querySelectorAll('#' + cat + '-container .menu-item');
        items.forEach(function(item) {
            const nom = item.querySelector('.item-nom').value.trim();
            const prix = item.querySelector('.item-prix').value.trim();
            if (nom) menu[cat].push({ nom: nom, prix: prix });
        });
    });
    let hasError = false;
    Object.keys(menu).forEach(function(cat) {
        menu[cat].forEach(function(item) {
            if (item.nom && !item.prix) {
                alert('Prix obligatoire pour : ' + item.nom.split('\n')[0]);
                hasError = true;
            }
        });
    });
    if (hasError) return;
    const btn = document.querySelector('.btn-submit');
    btn.textContent = '⏳ Génération en cours...';
    btn.disabled = true;
    fetch('/api/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ menu: menu })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success) {
            document.getElementById('qr-display').innerHTML = '<img src="data:image/png;base64,' + data.qr_code + '" alt="QR Code">';
            document.getElementById('github-link').href = data.github_url;
            document.getElementById('result-zone').style.display = 'block';
            document.getElementById('menuForm').style.display = 'none';
            btn.textContent = '🚀 Générer le menu et le Qrcode';
            btn.disabled = false;
        } else {
            alert('Erreur : ' + (data.error || 'Inconnue'));
            btn.textContent = '🚀 Générer le menu et le Qrcode';
            btn.disabled = false;
        }
    })
    .catch(function(err) {
        alert('Erreur réseau : ' + err);
        btn.textContent = '🚀 Générer le menu et le Qrcode';
        btn.disabled = false;
    });
});
</script>
</body>
</html>
