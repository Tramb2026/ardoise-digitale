<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Menu Généré - ArdoiseDigitale</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }body { font-family: 'Inter', sans-serif; background: #0a0a0a; padding: 20px; min-height: 100vh; color: #fafafa; display: flex; justify-content: center; align-items: center; }.container { max-width: 700px; background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); text-align: center; }h1 { color: #10b981; margin-bottom: 30px; font-size: 2.5rem; font-weight: 800; }.success { color: #34d399; font-size: 1.3rem; margin-bottom: 40px; font-weight: 600; }.qr-container { background: #fafafa; padding: 30px; border-radius: 16px; display: inline-block; margin: 30px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }.qr-container img { max-width: 500px; width: 100%%; height: auto; display: block; }.buttons { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }.btn { display: inline-block; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 1rem; transition: all 0.3s; cursor: pointer; border: none; }.btn-primary { background: #10b981; color: #0a0a0a; }.btn-primary:hover { background: #34d399; box-shadow: 0 6px 20px rgba(16,185,129,0.5); transform: translateY(-2px); }.btn-secondary { background: rgba(255,255,255,0.1); color: #fafafa; border: 2px solid rgba(255,255,255,0.2); }.btn-secondary:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }.footer { margin-top: 50px; padding-top: 25px; border-top: 2px solid rgba(255,255,255,0.1); color: #6b7280; font-size: 0.9rem; font-weight: 600; }@media print { body { background: white; } .container { background: white; box-shadow: none; border: none; } h1 { color: #10b981; } .success { color: #059669; } .buttons { display: none; } .footer { color: #666; } }</style></head><body><div class="container"><h1>✅ Menu Généré avec Succès !</h1><div class="success">Votre menu est maintenant en ligne</div><div class="qr-container"><img src="{{ qr_path }}" alt="QR Code"></div><div class="buttons"><a href="{{ github_url }}" target="_blank" class="btn btn-primary">🌐 Voir le menu en ligne</a><button onclick="window.print()" class="btn btn-secondary">🖨️ Imprimer le QR Code</button></div><div class="footer">ArdoiseDigitale v2026 - Traduction automatique multilingue</div></div></body></html>
